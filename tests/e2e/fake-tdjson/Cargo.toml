[package]
name = "fake-tdjson"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "A scripted stand-in for TDLib's libtdjson, for the end-to-end tests"
publish = false

[lib]
name = "tdjson"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only the types: "docs" generates them without linking the real TDLib.
tdlib = { package = "tdlib-rs", path = "../../../tdlib-rs", default-features = false, features = ["docs"] }

# Not a member of the workspace of the app.
[workspace]
