[package]
name = "paper-plane"
version = "0.1.0-beta.6"
authors = ["Marco Melorio <marco.melorio@protonmail.com>", "Marcus Behrendt <marcus.behrendt.86@gmail.com>"]
edition = "2021"

[package.metadata.system-deps]
tdjson = "1.8.65"

[dependencies]
adw = { version = "0.8", package = "libadwaita", features = ["v1_8"] }
anyhow = "1"
async-channel = "2"
ellipse = "0.2"
futures = { version = "0.3", default-features = false }
gettext-rs = { version = "=0.7.0", features = ["gettext-system"] }
gst = { version = "0.24", package = "gstreamer" }
gst-plugin-gtk4 = { version = "0.14", features = ["gtk_v4_16", "dmabuf", "wayland", "x11egl"] }
gtk = { version = "0.10", package = "gtk4", features = ["gnome_49", "blueprint"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
indexmap = "2"
libc = "0.2"
libvpx-native-sys = "5"
locale_config = "0.3"
log = "0.4"
matroska-demuxer = "0.8"
pretty_env_logger = "0.5"
qrcode-generator = { version = "5", default-features = false }
regex = "1"
rlt = { package = "gtk-rlottie", path = "crates/gtk-rlottie" }
shumate = { version = "0.7", package = "libshumate" }
tdlib = { version = "1.4", package = "tdlib-rs", features = ["pkg-config"] }
temp-dir = "0.1"
thiserror = "2"

[build-dependencies]
tdlib = { version = "1.4", package = "tdlib-rs", features = ["pkg-config"] }

[workspace]
members = ["crates/gtk-rlottie"]

[profile.release]
lto = true
codegen-units = 1

# tdlib-rs with TL schemas matching the system TDLib (see tdlib-rs/build.rs).
[patch.crates-io]
tdlib-rs = { path = "tdlib-rs" }
